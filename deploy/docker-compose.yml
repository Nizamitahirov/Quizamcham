# Jabr — Contabo serverində bütün xidmətlər. Sirlər deploy/.env faylındadır (yalnız serverdə; up.sh ilk dəfə yaradır).
name: jabr
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: jabr
      POSTGRES_USER: jabr
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD .env-də olmalıdır}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jabr -d jabr"]
      interval: 10s
      timeout: 5s
      retries: 10
    # port xaricə açılmır — yalnız daxili şəbəkə

  api:
    build: ../server
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://jabr:${POSTGRES_PASSWORD}@db:5432/jabr
      PORT: 3000
      # istəyə bağlı (deploy/.env): Google girişi, e-poçt, ictimai ünvan
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-noreply@jabr.az}
      PUBLIC_URL: ${PUBLIC_URL:-}
    depends_on:
      db:
        condition: service_healthy

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/backup.sh"]
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./backup.sh:/backup.sh:ro
      - ../backups:/backups
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_HOST: ${SITE_HOST:?SITE_HOST .env-də olmalıdır}
      SITE_REDIRECT: ${SITE_REDIRECT}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../web:/srv/www:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  pgdata:
  caddy_data:
  caddy_config:
