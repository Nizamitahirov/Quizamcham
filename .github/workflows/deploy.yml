name: Deploy (Contabo)

on:
  push:
    branches: [main]
    paths: ['server/**', 'deploy/**', 'src/**', 'public/**', 'index.html', 'package*.json', '.github/workflows/deploy.yml']
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - name: Frontend build
        run: npm ci && npm run build
        env:
          VITE_BACKEND: jabr
          VITE_GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
      - name: Caddy konfiqurasiyasını yoxla
        run: |
          docker run --rm -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" -e SITE_HOST=example.sslip.io -e SITE_REDIRECT=example.sslip.io \
            caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: SSH açarı
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
      - name: Faylları serverə göndər
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          rsync -az --delete dist/ "$SSH_USER@$SSH_HOST:/opt/jabr/web/"
          rsync -az --delete --exclude node_modules --exclude dist server/ "$SSH_USER@$SSH_HOST:/opt/jabr/server/"
          rsync -az --exclude .env deploy/ "$SSH_USER@$SSH_HOST:/opt/jabr/deploy/"
      - name: Xidmətləri qaldır
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SITE_HOST: ${{ vars.SITE_HOST }}
        run: |
          # domen yoxdursa: pulsuz ara ünvan <ip>.sslip.io (HTTPS ilə)
          host="${SITE_HOST:-${SSH_HOST//./-}.sslip.io}"
          ssh "$SSH_USER@$SSH_HOST" "SITE_HOST='$host' bash /opt/jabr/deploy/up.sh"
      - name: HTTPS ünvanı xaricdən yoxla
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SITE_HOST: ${{ vars.SITE_HOST }}
        run: |
          host="${SITE_HOST:-${SSH_HOST//./-}.sslip.io}"; host="${host%%,*}"
          # ilk dəfə sertifikat alınması bir az çəkə bilər
          for i in $(seq 1 30); do curl -fsS "https://$host/api/health" && exit 0; sleep 5; done
          echo "HTTPS hələ cavab vermir: $host"; exit 1
