name: Deploy (Contabo)

on:
  push:
    branches: [main]
    paths: ['server/**', 'deploy/**', 'src/**', 'public/**', 'index.html', 'package*.json', '.github/workflows/deploy.yml']
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - name: Frontend build
        run: npm ci && npm run build
        env:
          VITE_BACKEND: jabr
          VITE_GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
      - name: Caddy konfiqurasiyasını yoxla
        run: |
          docker run --rm -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" -e SITE_HOST=example.sslip.io -e SITE_REDIRECT=example.sslip.io \
            caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: SSH açarı
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
      - name: Faylları serverə göndər
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          rsync -az --delete dist/ "$SSH_USER@$SSH_HOST:/opt/jabr/web/"
          rsync -az --delete --exclude node_modules --exclude dist server/ "$SSH_USER@$SSH_HOST:/opt/jabr/server/"
          rsync -az --exclude .env deploy/ "$SSH_USER@$SSH_HOST:/opt/jabr/deploy/"
      - name: Server sirləri (.env) — GitHub Secrets-dən, stdin ilə (loglarda görünmür)
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
        run: |
          for name in GROQ_API_KEY BREVO_API_KEY; do
            val="${!name}"; [ -n "$val" ] || continue
            printf '%s' "$val" | ssh "$SSH_USER@$SSH_HOST" "v=\$(cat); f=/opt/jabr/deploy/.env; grep -v '^$name=' \$f > \$f.tmp || true; printf '%s=%s\n' '$name' \"\$v\" >> \$f.tmp; chmod 600 \$f.tmp; mv \$f.tmp \$f"
            echo "$name → .env"
          done
      - name: Xidmətləri qaldır
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SITE_HOST: ${{ vars.SITE_HOST }}
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
        run: |
          # əsas domen (SITE_HOST) + həmişə işləyən ehtiyat ünvan <ip>.sslip.io — domenin DNS-i hələ hazır deyilsə sayt yenə açılır
          fallback="${SSH_HOST//./-}.sslip.io"
          host="${SITE_HOST:+$SITE_HOST, }$fallback"
          ssh "$SSH_USER@$SSH_HOST" "SITE_HOST='$host' GOOGLE_CLIENT_ID='$GOOGLE_CLIENT_ID' SERVER_IP='$SSH_HOST' bash /opt/jabr/deploy/up.sh"
      - name: HTTPS ünvanlarını xaricdən yoxla
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SITE_HOST: ${{ vars.SITE_HOST }}
        run: |
          fallback="${SSH_HOST//./-}.sslip.io"
          # ilk dəfə sertifikat alınması bir az çəkə bilər; ehtiyat ünvan mütləq işləməlidir
          ok=0; for i in $(seq 1 30); do curl -fsS "https://$fallback/api/health" && { ok=1; break; }; sleep 5; done
          [ "$ok" = 1 ] || { echo "HTTPS cavab vermir: $fallback"; exit 1; }
          IFS=',' read -ra hosts <<< "${SITE_HOST:-}"
          for h in "${hosts[@]}"; do
            h="$(echo "$h" | tr -d ' ')"; [ -n "$h" ] || continue
            if curl -fsS -m 20 "https://$h/api/health" >/dev/null; then echo "✅ https://$h işləyir"
            else echo "::warning::https://$h hələ cavab vermir (DNS yayılmasını gözləyin; sertifikat avtomatik alınacaq)"; fi
          done
          # SEO marşrutları Caddy-dən keçir (köhnə konfiqurasiya qalarsa burada görünür)
          main="$(echo "${SITE_HOST:-$fallback}" | cut -d, -f1 | tr -d ' ')"
          curl -fsS -m 20 "https://$main/sitemap-quizzes.xml" | grep -q '<urlset' && echo "✅ quiz sitemap" || { echo "sitemap-quizzes.xml XML qaytarmır"; exit 1; }
          curl -fsS -m 20 "https://$main/pricing" | grep -q 'canonical" href="https://jabr.az/pricing"' && echo "✅ /pricing öz HTML-i" || { echo "/pricing öz HTML-ini qaytarmır"; exit 1; }
